name: build
on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet test tests/SpaceMouse.Core.Tests -c Release

  windows-release:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Build release (tests, portable zip, installer)
        shell: bash
        run: |
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          VERSION=1.0.0 ./build/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SpaceMouseStudio-windows
          path: |
            dist/*.zip
            dist/*.exe
